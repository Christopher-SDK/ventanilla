name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VENTANILLA_MODO: reproducir   # sin modelo: las respuestas salen de grabaciones/
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  suite:
    name: Suite completa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: Pruebas
        run: uv run pytest --alluredir=allure-results --junitxml=reporte/junit.xml
      - name: Dependencias sin vulnerabilidades conocidas + SBOM
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit==2.10.1 -r requirements.txt --strict
          uvx pip-audit==2.10.1 -r requirements.txt -f cyclonedx-json -o reporte/sbom.cdx.json
      - name: Modelos fijados
        run: uv run pytest tests/suministro -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite
          path: |
            allure-results
            reporte

  fallas:
    name: Falla ${{ matrix.falla }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        falla: [TASA_INVENTADA, CITA_FANTASMA, INYECCION_INDIRECTA, FUGA_DE_DATOS, JUEGO_DE_ROL, RECHAZO_EXCESIVO, REGRESION_DE_PROMPT]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: La suite tiene que atrapar la falla
        run: |
          if uv run pytest -q --falla ${{ matrix.falla }} -p no:randomly > salida.txt 2>&1; then
            echo "::error::La falla ${{ matrix.falla }} pasó sin que ninguna prueba la detectara"
            cat salida.txt
            exit 1
          fi
          grep -E "^FAILED" salida.txt | head -20
          tail -1 salida.txt

  promptfoo:
    name: Red team con promptfoo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - name: Casos generados desde evals/ (no deben estar desactualizados)
        run: |
          uv run python scripts/generar_promptfoo.py
          git diff --exit-code evals/promptfoo/promptfooconfig.yaml
      - name: API con respuestas grabadas
        run: |
          VENTANILLA_POR_MINUTO=100000 uv run uvicorn ventanilla.adaptadores.api:app_desde_entorno --factory --port 8765 &
          for i in $(seq 30); do curl -sf localhost:8765/api/salud && break; sleep 1; done
      - name: promptfoo eval
        working-directory: evals/promptfoo
        run: npx --yes promptfoo@0.126.0 eval -c promptfooconfig.yaml --no-cache -j 4 -o ../../reporte/promptfoo.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promptfoo
          path: reporte/promptfoo.json

  carga:
    name: Carga con Locust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/carga.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carga
          path: reporte/carga

  matriz:
    name: Matriz de detección
    needs: [suite, fallas]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: Matriz
        run: |
          uv run python scripts/matriz.py
          cat reporte/matriz.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matriz
          path: reporte

  web:
    name: Página demo
    needs: [suite, fallas]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: Datos de esta corrida (matriz, métricas y escenarios del sistema real)
        run: |
          uv run python scripts/matriz.py
          uv run python scripts/datos_web.py
      - name: Construir la web
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/download-artifact@v8
        with:
          name: suite
          path: suite
      - name: Reporte Allure en /allure
        run: npx --yes allure-commandline@2.46.1 generate suite/allure-results --clean -o web/dist/allure
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publicar:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
