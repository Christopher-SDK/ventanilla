# docker compose up --build  →  http://localhost:8080 (o el puerto de VENTANILLA_PUERTO)
# La primera vez descarga los modelos (~2,5 GB). En Mac, Docker no usa la GPU: si ya tienes Ollama instalado,
# es más rápido con  OLLAMA_HOST=http://host.docker.internal:11434 docker compose up --build api
services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes: [ollama:/root/.ollama]
    environment: {OLLAMA_NUM_PARALLEL: "1"}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  modelos:
    image: ollama/ollama:0.40.16
    depends_on: {ollama: {condition: service_healthy}}
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    entrypoint: ["sh", "-c", "ollama pull qwen3.5:2b-q4_K_M && ollama pull embeddinggemma:300m"]
    restart: "no"

  api:
    build: .
    depends_on: {modelos: {condition: service_completed_successfully}}
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      VENTANILLA_MODO: auto
      VENTANILLA_FALLA: ${VENTANILLA_FALLA:-}
    ports: ["${VENTANILLA_PUERTO:-8080}:8000"]

volumes:
  ollama:
